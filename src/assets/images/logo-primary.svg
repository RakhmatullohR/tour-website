<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1189a6"/>
      <stop offset="100%" stop-color="#0c4a5a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5b358"/>
      <stop offset="100%" stop-color="#d9832a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06232b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Logo Icon Group -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Base Icon Container -->
    <rect x="10" y="10" width="220" height="220" rx="48" fill="url(#brandGrad)"/>
    
    <!-- Stylized Globe Longitude & Latitude Arcs -->
    <circle cx="120" cy="120" r="82" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
    <ellipse cx="120" cy="120" rx="42" ry="82" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3"/>
    <path d="M 38 120 Q 120 160 202 120" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3"/>
    
    <!-- Dynamic Orbit Trail -->
    <path d="M 45 175 C 60 205, 140 215, 185 155 C 205 125, 200 70, 150 52" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Stylized Modern Airplane -->
    <g transform="translate(120, 115) rotate(-35) scale(1.15)">
      <!-- Main Jet Body -->
      <path d="M 0 -48 L 10 28 L 0 22 L -10 28 Z" fill="#ffffff"/>
      <!-- Main Wings -->
      <path d="M 0 -15 L 42 16 L 36 24 L 0 10 L -36 24 L -42 16 Z" fill="#ffffff"/>
      <!-- Tail Wings -->
      <path d="M 0 18 L 18 34 L 14 38 L 0 32 L -14 38 L -18 34 Z" fill="url(#goldGrad)"/>
    </g>
    
    <!-- Accent Sparkle -->
    <circle cx="195" cy="55" r="7" fill="#f2a03d"/>
  </g>

  <!-- Typography Group -->
  <text x="310" y="148" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-1" fill="#0c4a5a">
    GETCAR
  </text>
  
  <text x="314" y="218" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="11" fill="#d9832a">
    TRAVEL
  </text>

  <line x1="620" y1="206" x2="880" y2="206" stroke="#1189a6" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.3"/>
  <circle cx="895" cy="206" r="4" fill="#f2a03d"/>
</svg>
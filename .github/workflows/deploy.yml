# PLAN §8.4 — THE PUBLISHING PIPELINE IS A P0 DELIVERABLE, NOT AN ASSUMPTION.
#
# Without this, the client commits a tour to GitHub and NOTHING HAPPENS: no
# rebuild, no deploy, site unchanged — while they believe they published. That
# collapses the entire "client maintains it themselves" story.
#
# REPO MUST BE PRIVATE (BC2). GitHub auto-disables scheduled workflows after 60
# days of inactivity IN PUBLIC REPOSITORIES ONLY, and the weekly cron below is
# what keeps build-time departure filtering (§7.3) from drifting.
name: Build and deploy

on:
  push:
    branches: [main]
  # A URL the client can bookmark to force a rebuild.
  workflow_dispatch:
  # §7.3 layer 3 — keeps the build-time departure floor within seven days.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: WRITE, not read. The workflow-level default above is read, and
    # `repos.createCommitComment` — the whole mechanism behind the Uzbek failure
    # notice below — needs write on Contents. With read it 403s, which means the
    # client-facing safety net fails silently exactly when it is needed: the build
    # is already red, so nobody notices a second failure inside the notifier.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Fonts are bundled in scripts/fonts/ precisely so this step is hermetic on
      # a bare runner. The render assertion inside check-images.mjs fails loudly if
      # the labels did not render, instead of silently shipping blank placeholders.
      - name: Verify images
        run: npm run check:images

      - name: Type check
        run: npm run check

      # C6/C7 were both silent orthography defects: `O'zbekcha` with an ASCII
      # apostrophe on EVERY page, and `Ko'k masjid` inside a tour itinerary. The
      # gate that catches them existed in package.json but was never wired into
      # CI, so it only ever ran when someone remembered to type check:all. That
      # was survivable while this pipeline merely archived dist/. It is not
      # survivable now that the next step publishes.
      - name: i18n and orthography
        run: npm run check:i18n

      # C3 was `--color-neutral-400` on white at 2.55:1, shipped on the struck
      # old price and the "(optional)" label. Same argument: hermetic, fast, and
      # the only thing standing between a palette edit and a WCAG regression
      # reaching visitors.
      - name: Colour contrast
        run: npm run check:contrast

      - name: Build
        run: npm run build
        # LEFT is the name src/config/site.ts actually reads; RIGHT is the name
        # the secret is stored under. They differ, and that is now deliberate and
        # documented rather than accidental.
        #
        # These were PUBLIC_FORM_ENDPOINT / PUBLIC_FORM_TOKEN / PUBLIC_METRICA_ID
        # — a namespace NOTHING in the tree reads. `grep -rn PUBLIC_ src/` is
        # empty. site.ts reads METRICA_ID, LEAD_ENDPOINT and LEAD_TOKEN, and
        # .env.example agrees. So a CI build was green while LEAD_ENDPOINT fell
        # back to '' and every lead form shipped with an empty action: the site
        # looked finished and silently collected nothing. Harmless while the
        # pipeline only archived dist/; a launch defect the moment it publishes.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          METRICA_ID: ${{ vars.METRICA_ID }}
          # LEAD_ENDPOINT and LEAD_TOKEN are gone (2026-08-24). The endpoint is a
          # same-origin constant in src/config/site.ts and the bot token lives in
          # the Pages environment, so there is nothing left to inject — and a build
          # can no longer ship forms that post to an empty string.

      # The lead endpoint is a Pages Function now, and `pages deploy` bundles it
      # SILENTLY: a handler that fails to compile would be discovered by leads not
      # arriving, which is the failure mode this whole migration exists to remove.
      # Compiling it here fails the build BEFORE anything publishes, and doubles as
      # the check that wrangler finds ./functions at all.
      # NOTE the outfile name. `--outfile` writes a Cloudflare WORKER BUNDLE, which
      # is multipart-encoded and not valid JS, and anything called `_worker.js` is
      # the Pages advanced-mode convention — writing one where a later build can
      # find it makes that build try to parse it as source and fail with a
      # baffling "Expected ; but found :". Give it a name nothing looks for.
      #
      # The version is PINNED, and it must match `wranglerVersion` on the deploy
      # step below. If the checker and the deployer are different majors, this step
      # can pass while the thing that actually ships is bundled by different code —
      # which is the one failure this check exists to prevent. Both were verified
      # against the real handler: compile + `pages dev` behaviour identical on
      # 3.114.17 and 4.x.
      - name: Compile the lead function
        run: npx --yes wrangler@4 pages functions build --outfile=/tmp/lead-fn-bundle.js

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

      # PLAN §8.4 / docs/DEPLOY.md — Variant C, Cloudflare Pages. Chosen once the
      # domain question closed: getcartravel.uz was registered from scratch on
      # 2026-08-19, so its DNS zone is empty. BC17a's record-and-recreate-MX
      # checklist guards against destroying mail that already rides on the zone —
      # there is no such mail here, which is what removed the objection to moving
      # nameservers. Anything added to that zone later (MX for corporate mail) is
      # an addition to a zone we own, not a migration.
      #
      # Deploying from THIS job, rather than from Cloudflare's own Git
      # integration, is the point: Pages' builder would run `npm run build` alone
      # and skip `check:images` and `check` entirely, so a blank placeholder or a
      # type error would publish. Here the artifact that ships is the same one the
      # gates above already passed, and the secrets stay in one place.
      #
      # `success() &&` is NOT redundant. Naming an `if:` at all discards the
      # implicit success() guard, so `if: github.ref == ...` on its own would
      # publish a half-built dist/ after a failed build. The ref test itself
      # matters because workflow_dispatch can be fired from any branch.
      - name: Deploy to Cloudflare Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned to the same major as the compile step above. Left unset, the
          # action installs whatever is newest on the day it runs, so a wrangler
          # release could change how functions/ is bundled without a single commit
          # in this repo.
          wranglerVersion: '4'
          # --branch=main is what marks this the PRODUCTION deployment; without it
          # wrangler guesses from git state and can file a run as a preview.
          # --commit-dirty: dist/ is gitignored, so the tree is "dirty" by design.
          command: pages deploy dist/ --project-name=getcartravel --branch=main --commit-dirty=true

      # PLAN §8.3 — turn a Zod failure into something the CLIENT can act on.
      # This is what makes "the build fails loudly" a client-facing safety net
      # rather than a developer convenience.
      - name: Explain the failure in Uzbek
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Sayt yangilanmadi',
              '',
              'Oxirgi oʻzgarishda xatolik bor, shuning uchun sayt YANGILANMADI.',
              'Muhimi: eski sayt oʻz oʻrnida ishlab turibdi — hech narsa buzilmadi.',
              '',
              'Nima qilish kerak:',
              '1. Yuqoridagi qizil "Details" tugmasini bosing va xato matnini koʻring.',
              '2. Odatda sabab — JSON faylda qavs yoki qoʻshtirnoq tushib qolgani.',
              '3. Tuzatolmasangiz shu havolani dasturchiga yuboring.',
              '',
              `Havola: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });

  # ---------------------------------------------------------------------------
  # DEPLOY — Client question 1 is ANSWERED. Variant C (Cloudflare Pages) ships,
  # wired as the "Deploy to Cloudflare Pages" step inside the build job above
  # rather than as a separate job, so the failure notifier's `if: failure()`
  # covers a failed publish too, not just a failed build.
  #
  # Variants A (cPanel/FTP) and B (VPS/rsync) are recorded in docs/DEPLOY.md and
  # are not carried here as commented YAML — dead code in a pipeline is a trap.
  #
  # Required before the first green run (docs/DEPLOY.md has the walkthrough):
  #   · Cloudflare Pages project `getcartravel`, created as DIRECT UPLOAD.
  #     `wrangler pages deploy` cannot create a project non-interactively; the
  #     first run fails with "project not found" if this was skipped.
  #   · Repo secrets:   CLOUDFLARE_API_TOKEN  (Cloudflare Pages:Edit, that scope
  #                     and no other),  CLOUDFLARE_ACCOUNT_ID
  #   · Repo variable:  SITE_URL = https://getcartravel.uz
  #     Leave it unset and astro.config.mjs falls back to the same value — the
  #     `||` there exists because an unset GitHub variable arrives as '', not
  #     undefined. Set it anyway, so the origin is declared in one obvious place.
  # ---------------------------------------------------------------------------
